<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LIMINAL · دوئل نردبان‌ها (جفتی، هوشمند)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #030406; color: rgba(255,255,255,0.88);
         font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.7; padding: 20px 16px 60px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
  .muted { color: rgba(255,255,255,0.50); font-size: 13px; }
  .box { margin-top: 14px; padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.10); background: #060709; }
  .chk { display: block; padding: 6px 2px; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; }
  .duel { display: grid; gap: 12px; margin-top: 12px; }
  .side { border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); overflow: hidden; }
  .scene { padding: 14px; }
  .panel { border-radius: 14px; padding: 14px; color: #E9ECF2; }
  .ctrl-row { display: flex; gap: 8px; margin-top: 12px; }
  .ctrl { flex: 1; min-height: 42px; border-radius: 10px; color: #E9ECF2; font: inherit; font-size: 14px; border: 0; }
  .menu { margin-top: 12px; border-radius: 12px; padding: 6px; color: #E9ECF2; }
  .menu div { padding: 8px 10px; border-radius: 8px; font-size: 14px; }
  .modal { margin-top: 12px; border-radius: 14px; padding: 14px; color: #E9ECF2; }
  .toast { margin-top: 10px; border-radius: 10px; padding: 9px 12px; font-size: 13px; }
  .pick { width: 100%; min-height: 50px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16);
          background: transparent; color: rgba(255,255,255,0.9); font: inherit; cursor: pointer; }
  .pick.primary { background: #E9ECF2; color: #060709; border-color: transparent; }
  .pick:disabled { opacity: 0.4; }
  .bar { height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; margin: 12px 0; overflow: hidden; }
  .bar > div { height: 100%; background: rgba(255,255,255,0.5); width: 0%; transition: width 150ms; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  textarea { width: 100%; min-height: 80px; background: #0b0d10; color: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.12);
             border-radius: 10px; padding: 10px; font-family: "JetBrains Mono", monospace; font-size: 12px; direction: ltr; }
  button.small { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.16); background: transparent; color: #E9ECF2; font: inherit; font-size: 13px; cursor: pointer; margin-top: 10px; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>دوئل نردبان‌ها</h1>
  <div class="muted">هر بار دو نسخه را کنار هم می‌بینی. آن را انتخاب کن که مرز لایه‌ها را واضح‌تر و طبیعی‌تر نشان می‌دهد. فقط با نگاه اول قضاوت کن.</div>

  <div class="box" id="setup">
    <h2>شرایط نور اتاق (قبل از شروع ثبت می‌شود)</h2>
    <label class="chk"><input type="radio" name="room" value="dim-64lx" checked> <b>کم‌نور ≈ ۶۴ لوکس</b> — استاندارد</label>
    <label class="chk"><input type="radio" name="room" value="typical-200lx"> عادی ≈ ۲۰۰ لوکس — روشنایی معمول اتاق</label>
    <label class="chk"><input type="checkbox" id="manual"> روشنایی گوشی دستی است و auto خاموش است</label>
    <button class="pick primary" id="start" style="margin-top:10px" disabled>شروع دوئل</button>
  </div>

  <div class="box hide" id="game">
    <div class="mono muted" id="progress"></div>
    <div class="bar"><div id="bar"></div></div>
    <div class="duel" id="duel"></div>
    <div class="muted" style="margin-top:10px">کدام را بهتر می‌بینی؟</div>
    <div class="duel" style="grid-template-columns:1fr 1fr; gap:10px; margin-top:6px">
      <button class="pick primary" id="pickL">چپ</button>
      <button class="pick primary" id="pickR">راست</button>
    </div>
  </div>

  <div class="box hide" id="result">
    <h2>رتبه‌بندی</h2>
    <div id="ranking"></div>
    <div class="row" style="margin-top:8px"><span>هم‌خوانی تکرار</span><span class="mono" id="agree"></span></div>
    <div class="row"><span>تعداد مقایسه</span><span class="mono" id="comps"></span></div>
    <div class="muted" style="margin-top:10px" id="verdict"></div>
    <textarea id="export" readonly style="margin-top:10px"></textarea>
    <button class="small" id="copy">کپی</button>
    <button class="small" id="again">دوئل جدید</button>
  </div>
</div>

<script>
// ── engine math: L(n) = L0 + n·δ, realised as OKLCH → sRGB hex ──
const L0 = 0.128, Q = 0.0083, C = 0.0069, H = 258.4, CAP = 0.204;
const CANDIDATES = [
  { name: '0.90q', d: 0.90*Q }, { name: '0.95q', d: 0.95*Q }, { name: '1.00q', d: 1.00*Q },
  { name: '1.07q', d: 1.07*Q }, { name: '1.14q (فرمول)', d: 1.1416*Q },
];
const MAX_COMPS = 12, MIN_COMPS = 8, GAP_STOP = 0.30;

function oklchToHex(L, c, h){
  const a = c*Math.cos(h*Math.PI/180), b = c*Math.sin(h*Math.PI/180);
  const l_ = L + 0.3963377774*a + 0.2158037573*b, m_ = L - 0.1055613458*a - 0.0638541728*b, s_ = L - 0.0894841775*a - 1.2914855480*b;
  const l = l_**3, m = m_**3, s = s_**3;
  const r = 4.0767416621*l - 3.3077115913*m + 0.2309699292*s;
  const g = -1.2684380046*l + 2.6097574011*m - 0.3413193965*s;
  const bl = -0.0041960863*l - 0.7034186147*m + 1.7076147010*s;
  const enc = v => { v = Math.min(1, Math.max(0, v)); v = v <= 0.0031308 ? 12.92*v : 1.055*Math.pow(v, 1/2.4) - 0.055; return Math.round(v*255); };
  return '#' + [r, g, bl].map(enc).map(x => x.toString(16).padStart(2,'0')).join('');
}
function levels(d){ return Array.from({ length: 9 }, (_, n) => oklchToHex(L0 + n*d, C, H)); }
function scene(lv){
  return `<div class="scene" style="background:${lv[0]}">
    <div class="panel" style="background:${lv[3]}">
      <div style="font-weight:600">کارت تنظیمات</div>
      <div style="color:rgba(233,236,242,0.6);font-size:13px">یک متن نمونه برای سنجش تفکیک لایه‌ها.</div>
      <div class="ctrl-row"><button class="ctrl" style="background:${lv[4]}">ذخیره</button><button class="ctrl" style="background:${lv[4]}">لغو</button></div>
      <div class="menu" style="background:${lv[5]}"><div>گزینهٔ اول</div><div style="background:${lv[6]}">گزینهٔ دوم (انتخاب‌شده)</div><div>گزینهٔ سوم</div></div>
    </div>
    <div class="modal" style="background:${lv[7]}"><div style="font-weight:600">تأیید حذف؟</div>
      <div class="toast" style="background:${lv[8]}">این کار قابل برگشت نیست.</div></div>
  </div>`;
}

// ── duel state ──
let ROOM = null, wins = {}, seen = new Map(), comps = [], pair = null, repeatDone = false;
const key = (a, b) => [a, b].sort().join('|');

function rate(name){ const w = wins[name] || 0, n = comps.filter(x => x.a === name || x.b === name).length; return (w + 1)/(n + 2); }

function nextPair(){
  // smart choice: unseen pair whose current ratings are closest (most informative)
  let best = null, bestGap = Infinity;
  for (let i = 0; i < CANDIDATES.length; i++) for (let j = i+1; j < CANDIDATES.length; j++) {
    const A = CANDIDATES[i], B = CANDIDATES[j];
    if (seen.has(key(A.name, B.name))) continue;
    const gap = Math.abs(rate(A.name) - rate(B.name));
    if (gap < bestGap) { bestGap = gap; best = [A, B]; }
  }
  if (best) return best;
  // one repeat of the top pair, reversed, to measure self-consistency
  if (!repeatDone) { repeatDone = true; const t = ranked(); return [t[1], t[0]].map(x => x.c); }
  return null;
}
function ranked(){
  return CANDIDATES.map(c => ({ c, r: rate(c.name) })).sort((x, y) => y.r - x.r);
}
function converged(){
  const r = ranked();
  return comps.length >= MIN_COMPS && (r[0].r - r[1].r) >= GAP_STOP;
}
function showPair(){
  const [A, B] = pair;
  $('duel').innerHTML = [A, B].map((c, i) => `<div class="side"><div style="padding:8px 12px;font-size:13px;background:#060709">${i===0?'چپ':'راست'}</div>${scene(levels(c.d))}</div>`).join('');
  $('progress').textContent = `مقایسه ${comps.length + 1} · حداکثر ${MAX_COMPS}`;
  $('bar').style.width = (comps.length / MAX_COMPS * 100) + '%';
}
function choose(side){
  const [A, B] = pair;
  const winner = side === 'L' ? A : B, loser = side === 'L' ? B : A;
  wins[winner.name] = (wins[winner.name] || 0) + 1;
  comps.push({ a: A.name, b: B.name, winner: winner.name, repeat: seen.has(key(A.name, B.name)) });
  seen.set(key(A.name, B.name), true);
  advance();
}
function advance(){
  if (comps.length >= MAX_COMPS || converged()) return finish();
  const n = nextPair();
  if (!n) return finish();
  pair = n; showPair();
}
function repeatAgreement(){
  const first = new Map();
  for (const c of comps) { const k = key(c.a, c.b); if (!first.has(k)) first.set(k, c.winner); else return first.get(k) === c.winner ? 1 : 0; }
  return null;
}
function finish(){
  const r = ranked();
  $('game').classList.add('hide'); $('result').classList.remove('hide');
  $('ranking').innerHTML = r.map((x, i) => `<div class="row"><span>${i+1}. ${x.c.name}</span><span class="mono">${(x.r*100).toFixed(0)}٪ · برد ${wins[x.c.name]||0}</span></div>`).join('');
  const ag = repeatAgreement();
  $('agree').textContent = ag === null ? '—' : (ag ? 'بله' : 'خیر');
  $('comps').textContent = comps.length;
  const gap = r[0].r - r[1].r;
  const valid = ag === 1 && gap >= GAP_STOP;
  $('verdict').textContent = valid
    ? `برنده‌ی واضح: ${r[0].c.name}. تکرار هم‌خوان بود.`
    : `نتیجه هنوز قطعی نیست (اختلاف رتبه‌ی اول و دوم ${(gap*100).toFixed(0)}٪، تکرار ${ag === 1 ? 'هم‌خوان' : ag === 0 ? 'ناهم‌خوان' : 'انجام نشد'}). یک دوئل دیگر در همان شرایط بزن.`;
  $('export').value = `DUEL room=${ROOM} winner=${r[0].c.name} gap=${(gap*100).toFixed(0)}% repeat=${ag===null?'none':ag?'agree':'disagree'} comps=${comps.length} valid=${valid?'YES':'NO'} | ` +
    r.map(x => `${x.c.name}:${(x.r*100).toFixed(0)}`).join(',');
  localStorage.setItem('liminal-ladder-duel', JSON.stringify([...(JSON.parse(localStorage.getItem('liminal-ladder-duel')||'[]')), { at: new Date().toISOString(), room: ROOM, ranking: r.map(x => ({ name: x.c.name, d: x.c.d, rate: x.r })), comps, valid }]));
}
function start(){
  ROOM = document.querySelector('input[name=room]:checked').value;
  wins = {}; seen = new Map(); comps = []; repeatDone = false;
  $('setup').classList.add('hide'); $('result').classList.add('hide'); $('game').classList.remove('hide');
  // opening pair: the two extreme candidates, so the first comparison carries the most information
  pair = [CANDIDATES[0], CANDIDATES[CANDIDATES.length-1]];
  showPair();
}
function $(id){ return document.getElementById(id); }
$('manual').addEventListener('change', () => { $('start').disabled = !$('manual').checked; });
$('start').addEventListener('click', start);
$('pickL').addEventListener('click', () => choose('L'));
$('pickR').addEventListener('click', () => choose('R'));
$('copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText($('export').value); } catch { $('export').select(); document.execCommand('copy'); } $('copy').textContent = 'کپی شد ✓'; });
$('again').addEventListener('click', () => { $('result').classList.add('hide'); $('setup').classList.remove('hide'); $('copy').textContent = 'کپی'; });
</script>
</body>
</html>
