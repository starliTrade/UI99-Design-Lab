<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#060709" />
<title>LIMINAL — باتن secondary روی هر لایه</title>
<link rel="stylesheet" href="./liminal.css" />
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--liminal-s0);color:rgba(255,255,255,.9);
    font:15px/1.8 system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:24px 14px 64px;display:flex;flex-direction:column;align-items:center}
  h1{font-size:19px;font-weight:700;margin:0 0 8px;text-align:center;letter-spacing:-.02em}
  .sub{color:rgba(255,255,255,.58);font-size:12.5px;max-width:78ch;text-align:center;margin-bottom:22px;line-height:2}
  code{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;background:rgba(255,255,255,.05);padding:1px 5px;border-radius:5px}
  .rows{width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px}
  .row{border-radius:13px;overflow:hidden;border:1px solid var(--liminal-role-panel-border)}
  .head{display:flex;justify-content:space-between;align-items:baseline;
        padding:8px 13px;font-size:11px;font-family:ui-monospace,Menlo,monospace;
        background:var(--liminal-s3);color:rgba(255,255,255,.45)}
  .stage{padding:20px;display:flex;align-items:center;justify-content:center}
  .btn{padding:10px 22px;border-radius:10px;font-size:13.5px;font-weight:600;border:1px solid transparent}
  .foot{display:flex;justify-content:space-between;padding:7px 13px;font-size:10.5px;
        font-family:ui-monospace,Menlo,monospace;background:var(--liminal-s3);color:rgba(255,255,255,.4)}
  .d{color:#7fd0a0}
  .note{max-width:560px;margin-top:20px;color:rgba(255,255,255,.5);font-size:12.5px;line-height:2;text-align:center}
</style>
</head>
<body>
  <h1>باتن <code>secondary</code> روی هر لایه</h1>
  <p class="sub">
    بدون مرز، فقط fill و ریم. هر کدام یک پله بالای میزبان خودش — پس <b>فاصله‌ی عددی همه‌جا یکی است</b>.
    ولی آیا <b>دیده شدنش</b> هم همه‌جا یکی است؟
  </p>
  <div class="rows" id="rows"></div>
  <p class="note" id="note"></p>
<script>
  const css = getComputedStyle(document.documentElement);
  const num = (n) => parseFloat(css.getPropertyValue(n));
  const S = (n) => css.getPropertyValue(`--liminal-s${n}`).trim();
  const CANVAS_L = num('--liminal-canvas-l'), STEP = num('--liminal-step');
  const C = num('--liminal-chroma'), H = num('--liminal-hue'), Q = num('--liminal-q');
  const at = (level) => `oklch(${(CANVAS_L + level * STEP).toFixed(7)} ${C} ${H})`;
  const ROLE = ['بوم', 'لایه ۱ · chrome', 'لایه ۲ · work', 'لایه ۳ · panel', 'لایه ۴ · control', 'menu', 'popover'];

  const rows = document.getElementById('rows');
  for (let n = 0; n < 7; n++) {
    const fill = n + 1;
    const el = document.createElement('div'); el.className = 'row';
    el.innerHTML = `
      <div class="head"><span>${ROLE[n]}</span><span>میزبان S${n} → fill S${fill}</span></div>
      <div class="stage" style="background:${S(n)}">
        <span class="btn" style="background:linear-gradient(${S(fill)},${S(fill)}) padding-box,linear-gradient(180deg,${at(fill+1.5)} 0%,${at(fill+1)} 55%,${at(fill+0.5)} 100%) border-box;color:${at(Math.min(8, fill+3))}">دکمه</span>
      </div>
      <div class="foot"><span>ΔL</span><span class="d">${(STEP/Q).toFixed(4)}q — همه‌جا یکی</span></div>`;
    rows.appendChild(el);
  }

  document.getElementById('note').innerHTML =
    `و یک نکته: عدد می‌گوید همه‌جا یکی است (<code>۱.۱۴۱۶q</code>) و نسبت کنتراست حتی روی
     <b>S3 کمی بالاتر</b> است. اگر چشم چیز دیگری می‌گوید، <b>عدد را باید باور کنیم یا چشم را؟</b>
     — و جواب این سؤال، همان چیزی است که این صفحه برایش ساخته شده.`;
</script>
</body>
</html>
