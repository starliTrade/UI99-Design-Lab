<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#060709" />
<title>LIMINAL — پالت نهایی</title>
<link rel="stylesheet" href="./liminal.css" />
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--liminal-s0);color:rgba(255,255,255,.9);
    font:15px/1.85 system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:22px 10px 64px;display:flex;flex-direction:column;align-items:center}
  h1{font-size:19px;font-weight:700;margin:0 0 8px;text-align:center;letter-spacing:-.02em}
  .sub{color:rgba(255,255,255,.58);font-size:12.5px;max-width:92ch;text-align:center;margin-bottom:20px;line-height:2}
  code{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;background:rgba(255,255,255,.05);padding:1px 5px;border-radius:5px}
  .q{width:100%;max-width:880px;border-radius:15px;padding:14px;margin-bottom:13px;
     background:var(--liminal-s3);border:1px solid var(--liminal-role-panel-border)}
  .q h2{font-size:13.5px;margin:0 0 4px;font-weight:600}
  .q .why{color:rgba(255,255,255,.45);font-size:11.5px;margin-bottom:12px;line-height:2}
  .row{display:flex;gap:3px;align-items:center;margin-bottom:3px}
  .name{width:78px;flex-shrink:0;font-size:9.5px;font-family:ui-monospace,Menlo,monospace;color:rgba(255,255,255,.42)}
  .sw{flex:1;height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;
      font-size:7.5px;font-family:ui-monospace,Menlo,monospace;color:rgba(0,0,0,.4)}
  .hdr{display:flex;gap:3px;margin-bottom:6px}
  .hdr span{flex:1;text-align:center;font-size:8.5px;font-family:ui-monospace,Menlo,monospace;color:rgba(255,255,255,.3);line-height:1.6}
  .hdr span:first-child{width:78px;flex:none}
  .job{display:flex;gap:3px;margin-bottom:10px}
  .job span{flex:1;text-align:center;font-size:8px;color:rgba(255,255,255,.22)}
  .job span:first-child{width:78px;flex:none}
  .demo{padding:16px;border-radius:11px;margin-bottom:9px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .btn{padding:8px 18px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid transparent}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opt{font:inherit;font-size:12px;padding:9px 14px;border-radius:10px;cursor:pointer;
       background:transparent;color:rgba(255,255,255,.7);border:1px solid var(--liminal-role-panel-border)}
  .opt[aria-pressed="true"]{background:var(--liminal-s8);color:var(--liminal-s0);font-weight:700}
</style>
</head>
<body>
  <h1>پالت نهایی — ۱۲ فام × ۷ پله</h1>
  <p class="sub">
    <b>۶۰٪ گاموت</b> · دامنهٔ <b>۰.۳۰ تا ۰.۷۸</b> · و هر پله یک <b>کار</b>:
    <b>fill</b> · <b>مرز</b> · <b>متن</b>. رنگ‌های معنایی از همین پالت مشتق می‌شوند.
  </p>

  <div class="q">
    <h2>پالت</h2>
    <div class="hdr"><span></span><span>۰.۳۰</span><span>۰.۳۸</span><span>۰.۴۶</span><span>۰.۵۴</span><span>۰.۶۲</span><span>۰.۷۰</span><span>۰.۷۸</span></div>
    <div class="job"><span></span><span>fill</span><span>fill</span><span>fill</span><span>مرز</span><span>مرز</span><span>متن</span><span>متن</span></div>
    <div id="grid"></div>
  </div>

  <div class="q">
    <h2>و روی هر سطح — یک دکمهٔ رنگی</h2>
    <div class="why">fill از پلهٔ ۳ · متن از پلهٔ ۷</div>
    <div id="demos"></div>
  </div>

  <div class="q">
    <h2>سؤال — این پالت نهایی است؟</h2>
    <div class="opts" id="q1">
      <button class="opt" data-q="1" data-v="yes">بله — بسازش و در سیاست بنویس</button>
      <button class="opt" data-q="1" data-v="tune">نزدیک است، ولی باید تنظیم شود</button>
      <button class="opt" data-q="1" data-v="no">نه — جهت دیگری لازم است</button>
    </div>
  </div>

<script>
  const css = getComputedStyle(document.documentElement);
  const S = (n) => css.getPropertyValue(`--liminal-s${n}`).trim();

  const toRgb = (L, C, h) => {
    const a = C * Math.cos((h * Math.PI) / 180), bb = C * Math.sin((h * Math.PI) / 180);
    const l_ = L + 0.3963377774 * a + 0.2158037573 * bb;
    const m_ = L - 0.1055613458 * a - 0.0638541728 * bb;
    const s_ = L - 0.0894841775 * a - 1.2914855480 * bb;
    const l = l_ ** 3, m = m_ ** 3, s = s_ ** 3;
    return [
      +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
      -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s,
    ];
  };
  const inGamut = (rgb) => rgb.every((v) => v >= -0.001 && v <= 1.001);
  const maxChroma = (L, h) => {
    let lo = 0, hi = 0.4;
    for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; if (inGamut(toRgb(L, mid, h))) lo = mid; else hi = mid; }
    return lo;
  };
  const toHex = (L, C, h) => '#' + toRgb(L, C, h).map((v) => {
    const c = v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(Math.max(0, v), 1 / 2.4) - 0.055;
    return Math.max(0, Math.min(255, Math.round(c * 255))).toString(16).padStart(2, '0');
  }).join('');

  const HUES = [
    [15,'Ruby'], [40,'Coral'], [75,'Amber'], [110,'Lime'], [145,'Emerald'], [175,'Teal'],
    [200,'Cyan'], [230,'Sapphire'], [260,'Indigo'], [290,'Violet'], [320,'Fuchsia'], [350,'Rose'],
  ];
  const LEVELS = [0.30, 0.38, 0.46, 0.54, 0.62, 0.70, 0.78];
  const F = 0.60;
  const hex = (L, h) => toHex(L, maxChroma(L, h) * F, h);

  const grid = document.getElementById('grid');
  for (const [h, name] of HUES) {
    grid.innerHTML += `<div class="row"><span class="name">${name}</span>` +
      LEVELS.map((L) => `<span class="sw" style="background:${hex(L, h)}">${hex(L, h).slice(1)}</span>`).join('') +
      `</div>`;
  }

  const demos = document.getElementById('demos');
  for (const [name, lv] of [['بوم',0],['سطح کار',2],['پنل',3],['modal',7],['toast',8]]) {
    demos.innerHTML += `<div class="demo" style="background:${S(lv)}">
      <div style="font-size:10px;font-family:ui-monospace,Menlo,monospace;color:rgba(255,255,255,.4);width:100%">${name} · S${lv}</div>
      ${HUES.slice(0, 6).map(([h]) => `
        <span class="btn" style="background:${hex(0.46, h)};color:${hex(0.78, h)}">دکمه</span>`).join('')}
    </div>`;
  }

  const answers = {};
  for (const b of document.querySelectorAll('.opt')) b.addEventListener('click', () => {
    const q = b.dataset.q;
    for (const s of document.querySelectorAll(`.opt[data-q="${q}"]`)) s.setAttribute('aria-pressed','false');
    b.setAttribute('aria-pressed', 'true'); answers[q] = b.dataset.v;
  });
</script>
</body>
</html>
