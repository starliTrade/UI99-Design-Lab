<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#060709" />
<title>LIMINAL — سیستم فوکوس، روی همه لایه‌ها</title>
<link rel="stylesheet" href="./liminal.css" />
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--liminal-s0);color:rgba(255,255,255,.9);
    font:15px/1.85 system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:22px 12px 64px;display:flex;flex-direction:column;align-items:center}
  h1{font-size:19px;font-weight:700;margin:0 0 8px;text-align:center;letter-spacing:-.02em}
  .sub{color:rgba(255,255,255,.58);font-size:12.5px;max-width:86ch;text-align:center;margin-bottom:20px;line-height:2}
  code{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;background:rgba(255,255,255,.05);padding:1px 5px;border-radius:5px}
  .q{width:100%;max-width:720px;border-radius:15px;padding:16px;margin-bottom:13px;
     background:var(--liminal-s3);border:1px solid var(--liminal-role-panel-border)}
  .q h2{font-size:13.5px;margin:0 0 4px;font-weight:600}
  .q .why{color:rgba(255,255,255,.45);font-size:11.5px;margin-bottom:14px;line-height:2}
  .band{padding:24px 10px;border-radius:11px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
  .cell{display:flex;flex-direction:column;gap:9px;align-items:center}
  .btn{padding:9px 18px;border-radius:9px;font-size:13px;font-weight:600}
  .cap{font-size:9.5px;color:rgba(255,255,255,.45);text-align:center;line-height:1.8;font-family:ui-monospace,Menlo,monospace;max-width:130px}
  .cap b{color:rgba(255,255,255,.8);font-size:10.5px;font-family:system-ui;display:block}
  .ok{color:#7fd0a0} .warn{color:#e0b070}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opt{font:inherit;font-size:12px;padding:9px 14px;border-radius:10px;cursor:pointer;
       background:transparent;color:rgba(255,255,255,.7);border:1px solid var(--liminal-role-panel-border)}
  .opt[aria-pressed="true"]{background:var(--liminal-s8);color:var(--liminal-s0);font-weight:700}
</style>
</head>
<body>
  <h1>سیستم فوکوس — لبهٔ دوگانه، روی همه لایه‌ها</h1>
  <p class="sub">
    <b>مرز داخلی</b> <code>fill + ۱</code> · <b>فاصله</b> <code>۲</code> پیکسل ·
    <b>خط بیرونی</b> <code>fill + ۲</code> — همه از نردبان، <b>هیچ روشنایی اضافه‌ای</b>.
  </p>

  <div id="bands"></div>

  <div class="q">
    <h2>سؤال — آیا این یک سیستم فوکوس است؟</h2>
    <div class="why">یعنی روی <b>هر لایه‌ای</b> کار می‌کند، و از هاور و active قابل تشخیص است؟</div>
    <div class="opts" id="q1">
      <button class="opt" data-q="1" data-v="yes">بله — سیستم فوکوس ساخته شد</button>
      <button class="opt" data-q="1" data-v="no">نه — حلقهٔ روشن لازم است</button>
      <button class="opt" data-q="1" data-v="tune">نزدیک است، ولی باید تنظیم شود</button>
    </div>
  </div>

<script>
  const css = getComputedStyle(document.documentElement);
  const num = (n) => parseFloat(css.getPropertyValue(n));
  const S = (n) => css.getPropertyValue(`--liminal-s${n}`).trim();
  const CANVAS_L = num('--liminal-canvas-l'), STEP = num('--liminal-step');
  const C = num('--liminal-chroma'), H = num('--liminal-hue'), Q = num('--liminal-q');
  const at = (level) => `oklch(${(CANVAS_L + level * STEP).toFixed(7)} ${C} ${H})`;
  const MAX = 8;
  const q = (d) => ((d * STEP) / Q).toFixed(2);

  const HOSTS = [
    { name: 'بوم', level: 0 }, { name: 'chrome', level: 1 }, { name: 'سطح کار', level: 2 },
    { name: 'پنل', level: 3 }, { name: 'منو', level: 5 }, { name: 'modal', level: 7 },
  ];

  const bands = document.getElementById('bands');
  for (const host of HOSTS) {
    const fill = Math.min(MAX, host.level + 1);
    const clamp = (n) => Math.max(0, Math.min(MAX, n));
    const el = document.createElement('div'); el.className = 'q';
    el.innerHTML = `<h2>${host.name} · S${host.level}</h2>
      <div class="why">fill: S${fill} · مرز: S${clamp(fill+1)} · خط بیرونی: S${clamp(fill+2)}</div>
      <div class="band" style="background:${S(host.level)}"></div>`;
    bands.appendChild(el);
    const band = el.querySelector('.band');

    /** The focus: a border, a 2px gap, and an outer line two steps above the fill. */
    const focusCss = `border:1px solid ${at(clamp(fill+1))};outline:1px solid ${at(clamp(fill+2))};outline-offset:2px`;

    const states = [
      ['idle', `background:${at(fill)};border:1px solid transparent;color:${at(clamp(fill+3))}`, '—'],
      ['hover', `background:${at(clamp(fill+1))};border:1px solid transparent;color:${at(clamp(fill+3))}`, `+${q(1)}q`],
      ['focus', `background:${at(fill)};${focusCss};color:${at(clamp(fill+3))}`, 'دوخطی'],
      ['active', `background:${at(clamp(fill-2))};border:1px solid transparent;color:${at(clamp(fill+3))}`, `−${q(2)}q`],
      ['disabled', `background:${at(clamp(fill-1))};border:1px solid transparent;color:${at(clamp(fill+1))}`, `−${q(1)}q`],
    ];
    for (const [label, style, note] of states) {
      const c = document.createElement('div'); c.className = 'cell';
      c.innerHTML = `<span class="btn" style="${style}">دکمه</span>
        <div class="cap"><b>${label}</b><span class="${label === 'focus' ? 'ok' : ''}">${note}</span></div>`;
      band.appendChild(c);
    }
  }

  const answers = {};
  for (const b of document.querySelectorAll('.opt')) b.addEventListener('click', () => {
    const qq = b.dataset.q;
    for (const s of document.querySelectorAll(`.opt[data-q="${qq}"]`)) s.setAttribute('aria-pressed','false');
    b.setAttribute('aria-pressed','true'); answers[qq] = b.dataset.v;
  });
</script>
</body>
</html>
