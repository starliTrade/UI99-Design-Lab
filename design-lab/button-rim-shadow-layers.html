<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#060709" />
<title>LIMINAL — ریم و سایهٔ باتن روی هر لایه</title>
<link rel="stylesheet" href="./liminal.css" />
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--liminal-s0);color:rgba(255,255,255,.9);
    font:15px/1.8 system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:26px 16px 64px;display:flex;flex-direction:column;align-items:center}
  h1{font-size:20px;font-weight:700;margin:0 0 8px;letter-spacing:-.02em;text-align:center}
  .sub{color:rgba(255,255,255,.58);font-size:13px;max-width:82ch;text-align:center;margin-bottom:8px;line-height:2}
  .formula{color:#7fd0a0;font-size:12px;text-align:center;margin-bottom:22px;
           font-family:ui-monospace,Menlo,monospace;line-height:2.1}
  code{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;background:rgba(255,255,255,.05);padding:1px 5px;border-radius:5px}
  h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
     color:rgba(255,255,255,.4);margin:26px 0 12px;align-self:flex-start;
     width:100%;max-width:640px;text-align:start}

  .rows{width:100%;max-width:640px;display:flex;flex-direction:column;gap:12px}
  .row{background:var(--liminal-s3);border:1px solid var(--liminal-role-panel-border);
       border-radius:14px;overflow:hidden}
  .head{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 8px;font-size:12px}
  .head .name{font-weight:600}
  .head .lv{color:rgba(255,255,255,.42);font-family:ui-monospace,Menlo,monospace;font-size:11px}
  .stage{padding:22px 14px;display:flex;align-items:center;justify-content:center;gap:26px}
  .btn{padding:10px 22px;border-radius:10px;font-size:13.5px;font-weight:600;
       display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent}
  .foot{display:flex;justify-content:space-between;align-items:baseline;
        padding:8px 14px 11px;font-size:11px;color:rgba(255,255,255,.45);
        font-family:ui-monospace,Menlo,monospace;border-top:1px solid var(--liminal-role-panel-border)}
  .foot .d{color:#7fd0a0}
  .warn{color:#e0b070 !important}
  .note{max-width:640px;margin-top:22px;color:rgba(255,255,255,.5);font-size:13px;line-height:2;text-align:center}
</style>
</head>
<body>
  <h1>ریم و سایهٔ باتن، روی هر لایه</h1>
  <p class="sub">
    هر دو مثل سیستم سطح‌ها: <b>یک عدد ثابت</b>، و نسبت به <b>خودِ باتن</b> اندازه‌گیری می‌شوند.
  </p>
  <div class="formula">
    ریم = fill + ۱.۵ / ۱ / ۰.۵ پله<br>
    سایه = یک کوانتوم زیر میزبان · شعاع از ارتفاع
  </div>

  <h2>ریم</h2>
  <div class="rows" id="rimRows"></div>

  <h2>سایه</h2>
  <div class="rows" id="shadowRows"></div>

  <p class="note" id="note"></p>

<script>
  const css = getComputedStyle(document.documentElement);
  const num = (n) => parseFloat(css.getPropertyValue(n));
  const S = (n) => css.getPropertyValue(`--liminal-s${n}`).trim();
  const CANVAS_L = num('--liminal-canvas-l'), STEP = num('--liminal-step');
  const C = num('--liminal-chroma'), H = num('--liminal-hue'), Q = num('--liminal-q');
  const at = (level) => `oklch(${(CANVAS_L + level * STEP).toFixed(7)} ${C} ${H})`;
  const q = (steps) => (steps * STEP / Q).toFixed(4);
  const MAX = 8;

  const ROLE = ['بوم', 'لایه ۱ · chrome', 'لایه ۲ · work', 'لایه ۳ · panel',
                'لایه ۴ · control', 'menu', 'popover', 'modal'];

  /** The rim, with the ceiling's two behaviours: it compresses, then it inverts. */
  const rim = (fill) => {
    const room = MAX - fill;
    if (room <= 0) return { top: fill - 0.5, side: fill - 1, bot: fill - 1.5, kind: 'معکوس' };
    if (room < 1.5) {
      const k = room / 1.5;
      return { top: fill + 1.5 * k, side: fill + 1 * k, bot: fill + 0.5 * k, kind: 'فشرده' };
    }
    return { top: fill + 1.5, side: fill + 1, bot: fill + 0.5, kind: 'عادی' };
  };

  const rimRows = document.getElementById('rimRows');
  for (let host = 0; host <= 7; host++) {
    const fill = Math.min(MAX, host + 1);
    const r = rim(fill);
    const capped = r.kind !== 'عادی';
    const el = document.createElement('div'); el.className = 'row';
    el.innerHTML = `
      <div class="head"><span class="name">${ROLE[host]}</span>
        <span class="lv">میزبان S${host} · fill S${fill}</span></div>
      <div class="stage" style="background:${S(host)}">
        <span class="btn" style="background:linear-gradient(${S(fill)},${S(fill)}) padding-box,
          linear-gradient(180deg,${at(r.top)} 0%,${at(r.side)} 55%,${at(r.bot)} 100%) border-box;
          color:${at(Math.min(MAX, fill + 3))}">دکمه</span>
      </div>
      <div class="foot">
        <span>ریم S${r.top.toFixed(2)} / S${r.side.toFixed(2)} / S${r.bot.toFixed(2)} ${capped ? '· ' + r.kind : ''}</span>
        <span class="d ${capped ? 'warn' : ''}">${capped ? (r.kind === 'معکوس' ? '−۰.۵۷q' : 'فشرده') : '+' + q(1.5) + 'q'}</span>
      </div>`;
    rimRows.appendChild(el);
  }

  /** The shadow: one quantum below the host, radius from the height above it. */
  const shadowRows = document.getElementById('shadowRows');
  for (let host = 0; host <= 7; host++) {
    const fill = Math.min(MAX, host + 1);
    const height = fill - host;                       // one step
    const near = 2 + height * 1.5, far = 4 + height * 6;
    const el = document.createElement('div'); el.className = 'row';
    el.innerHTML = `
      <div class="head"><span class="name">${ROLE[host]}</span>
        <span class="lv">میزبان S${host} · ارتفاع ${height}</span></div>
      <div class="stage" style="background:${S(host)}">
        <span class="btn" style="background:${S(fill)};box-shadow:0 ${near}px ${far}px rgba(1,2,3,.1326), 0 2px ${near}px rgba(1,2,3,.1326);color:${at(Math.min(MAX, fill + 3))}">دکمه</span>
      </div>
      <div class="foot">
        <span>شعاع ${near}px / ${far}px · روی ${S(host)}</span>
        <span class="d">−۱.۰۰۰۰q</span>
      </div>`;
    shadowRows.appendChild(el);
  }

  document.getElementById('note').innerHTML =
    `<b>و هر دو یک قاعده‌اند با سیستم سطح‌ها:</b> ریم باتن <code>+۱.۵</code> پله بالای fill خودش،
     و ریم یک سطح <code>+۱.۵</code> پله بالای خودش — یکی. سایه هم <b>یک کوانتوم زیر میزبانش</b>،
     هر چه ارتفاعش باشد.<br><br>
     <b>و دو استثنای سقف:</b> روی <b>popover</b> ریم <b>فشرده</b> می‌شود، و روی <b>modal</b>
     <b>معکوس</b>. همان تصمیم سقف سخت.`;
</script>
</body>
</html>
