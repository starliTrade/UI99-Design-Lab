<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LIMINAL · رقابت نردبان‌ها روی کامپوننت</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #030406; color: rgba(255,255,255,0.88);
         font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.7; padding: 20px 16px 60px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  .muted { color: rgba(255,255,255,0.50); font-size: 13px; }
  .variant { margin-top: 18px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); overflow: hidden; }
  .vhead { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-size: 14px; }
  .vhead b { font-family: "JetBrains Mono", monospace; }
  .scene { padding: 16px; }
  .panel { border-radius: 14px; padding: 14px; color: #E9ECF2; }
  .ctrl-row { display: flex; gap: 8px; margin-top: 12px; }
  .ctrl { flex: 1; min-height: 44px; border-radius: 10px; color: #E9ECF2; font: inherit; font-size: 14px; border: 0; }
  .menu { margin-top: 12px; border-radius: 12px; padding: 6px; color: #E9ECF2; }
  .menu div { padding: 9px 10px; border-radius: 8px; font-size: 14px; }
  .modal { margin-top: 12px; border-radius: 14px; padding: 14px; color: #E9ECF2; }
  .toast { margin-top: 10px; border-radius: 10px; padding: 9px 12px; font-size: 13px; }
  .pick { width: 100%; min-height: 50px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.16);
          background: transparent; color: rgba(255,255,255,0.9); font: inherit; cursor: pointer; }
  .pick:hover { background: rgba(255,255,255,0.06); }
  .pick.primary { background: #E9ECF2; color: #060709; border-color: transparent; }
  textarea { width: 100%; min-height: 60px; margin-top: 12px; background: #0b0d10; color: rgba(255,255,255,0.8);
             border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 10px; font: inherit; font-size: 13px; }
  .box { margin-top: 18px; padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.10); background: #060709; }
  textarea.ro { font-family: "JetBrains Mono", monospace; font-size: 12px; direction: ltr; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>کدام نردبان بهتر دیده می‌شود؟</h1>
  <div class="muted">سه نسخه، بی‌نام و با ترتیب تصادفی. هر کدام را روی همان کامپوننت‌ها ببین و یکی را انتخاب کن. فقط با نگاه اول قضاوت کن.</div>
  <div id="variants"></div>
  <div class="box hide" id="done">
    <div class="muted" id="reveal"></div>
    <textarea class="ro" id="export" readonly></textarea>
  </div>
  <div class="box">
    <div class="muted">اگر هیچ‌کدام درست نیست، دلیلت را بنویس:</div>
    <textarea id="why" placeholder="مثلاً: لایه‌ی مودال کم دیده می‌شود / منو از کنترل جدا نیست"></textarea>
    <button class="pick" id="none" style="margin-top:10px">هیچ‌کدام</button>
  </div>
</div>

<script>
// ── the engine's math: L(n) = L0 + n·δ, realised as OKLCH → sRGB hex ──
const L0 = 0.128, Q = 0.0083, C = 0.0069, H = 258.4, CAP = 0.204;
const CANDIDATES = [
  { name: '0.90q', d: 0.90 * Q },
  { name: '1.00q', d: 1.00 * Q },
  { name: '1.14q (فرمول)', d: 1.1416 * Q },   // = δ of POLICY §2 (max under the hard cap)
];
function oklchToHex(L, c, h){
  const a = c*Math.cos(h*Math.PI/180), b = c*Math.sin(h*Math.PI/180);
  const l_ = L + 0.3963377774*a + 0.2158037573*b, m_ = L - 0.1055613458*a - 0.0638541728*b, s_ = L - 0.0894841775*a - 1.2914855480*b;
  const l = l_**3, m = m_**3, s = s_**3;
  const r = 4.0767416621*l - 3.3077115913*m + 0.2309699292*s;
  const g = -1.2684380046*l + 2.6097574011*m - 0.3413193965*s;
  const bl = -0.0041960863*l - 0.7034186147*m + 1.7076147010*s;
  const enc = v => { v = Math.min(1, Math.max(0, v)); v = v <= 0.0031308 ? 12.92*v : 1.055*Math.pow(v, 1/2.4) - 0.055; return Math.round(v*255); };
  return '#' + [r, g, bl].map(enc).map(x => x.toString(16).padStart(2,'0')).join('');
}
function levels(d){ return Array.from({ length: 9 }, (_, n) => oklchToHex(L0 + n*d, C, H)); }
function l8(d){ return L0 + 8*d; }

// Roles on the ladder (ROLE_LEVEL): canvas 0 · panel 3 · control 4 · menu 5 · popover 6 · modal 7 · toast 8
function scene(lv){
  return `<div class="scene" style="background:${lv[0]}">
    <div class="panel" style="background:${lv[3]}">
      <div style="font-weight:600">کارت تنظیمات</div>
      <div class="muted" style="color:rgba(233,236,242,0.6)">یک متن نمونه برای سنجش خوانایی و تفکیک لایه‌ها.</div>
      <div class="ctrl-row">
        <button class="ctrl" style="background:${lv[4]}">ذخیره</button>
        <button class="ctrl" style="background:${lv[4]}">لغو</button>
      </div>
      <div class="menu" style="background:${lv[5]}">
        <div>گزینهٔ اول</div>
        <div style="background:${lv[6]}">گزینهٔ دوم (انتخاب‌شده)</div>
        <div>گزینهٔ سوم</div>
      </div>
    </div>
    <div class="modal" style="background:${lv[7]}">
      <div style="font-weight:600">تأیید حذف؟</div>
      <div class="toast" style="background:${lv[8]}">این کار قابل برگشت نیست.</div>
    </div>
  </div>`;
}

// blind, shuffled assignment: A/B/C ↔ candidates
const order = [...CANDIDATES].sort(() => Math.random() - 0.5);
const LETTERS = ['A','B','C'];
const mapping = order.map((c, i) => ({ letter: LETTERS[i], ...c }));

const vHost = document.getElementById('variants');
mapping.forEach(m => {
  const lv = levels(m.d);
  const el = document.createElement('div');
  el.className = 'variant';
  el.innerHTML = `<div class="vhead" style="background:#060709"><span>نسخهٔ <b>${m.letter}</b></span>
    <span class="muted">L(8) = ${l8(m.d).toFixed(4)} · ${lv.filter((_,i)=>i>=0).length} لایه</span></div>
    ${scene(lv)}
    <div style="padding:12px"><button class="pick primary" data-letter="${m.letter}">این نسخه بهتر است</button></div>`;
  vHost.appendChild(el);
});

function finish(choice, why){
  const rec = { at: new Date().toISOString(), engine: 'ladder-tournament-v1',
    choice: choice ? { letter: choice.letter, name: choice.name, d: choice.d, L8: l8(choice.d) } : null,
    mapping: mapping.map(m => ({ letter: m.letter, name: m.name, d: m.d })), why: why || '' };
  const all = JSON.parse(localStorage.getItem('liminal-ladder-tournament') || '[]'); all.push(rec);
  localStorage.setItem('liminal-ladder-tournament', JSON.stringify(all));
  document.querySelectorAll('.pick').forEach(b => b.disabled = true);
  document.getElementById('done').classList.remove('hide');
  document.getElementById('reveal').textContent = 'نسخه‌ها: ' + mapping.map(m => `${m.letter}=${m.name}`).join(' · ');
  document.getElementById('export').value = choice
    ? `TOURNAMENT choice=${choice.name} d=${choice.d.toFixed(6)} L8=${l8(choice.d).toFixed(4)} | ${mapping.map(m => `${m.letter}=${m.name}`).join(',')}${why ? ' | why=' + why : ''}`
    : `TOURNAMENT choice=NONE | ${mapping.map(m => `${m.letter}=${m.name}`).join(',')} | why=${why || '-'}`;
}
document.querySelectorAll('.pick[data-letter]').forEach(b => b.addEventListener('click', () => {
  const m = mapping.find(x => x.letter === b.dataset.letter);
  finish(m, document.getElementById('why').value.trim());
}));
document.getElementById('none').addEventListener('click', () => finish(null, document.getElementById('why').value.trim()));
</script>
</body>
</html>
