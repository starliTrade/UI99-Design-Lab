<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#060709" />
<title>LIMINAL — مرز باتن روی هر لایه</title>
<link rel="stylesheet" href="./liminal.css" />
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--liminal-s0);color:rgba(255,255,255,.9);
    font:15px/1.8 system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:26px 16px 64px;display:flex;flex-direction:column;align-items:center}
  h1{font-size:20px;font-weight:700;margin:0 0 8px;letter-spacing:-.02em;text-align:center}
  .sub{color:rgba(255,255,255,.58);font-size:13px;max-width:80ch;text-align:center;margin-bottom:8px;line-height:2}
  .formula{color:#7fd0a0;font-size:12.5px;text-align:center;margin-bottom:22px;
           font-family:ui-monospace,Menlo,monospace;line-height:2}
  code{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;background:rgba(255,255,255,.05);padding:1px 5px;border-radius:5px}

  .rows{width:100%;max-width:640px;display:flex;flex-direction:column;gap:12px}
  .row{background:var(--liminal-s3);border:1px solid var(--liminal-role-panel-border);
       border-radius:14px;overflow:hidden}
  .head{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 8px;font-size:12px}
  .head .name{font-weight:600}
  .head .lv{color:rgba(255,255,255,.42);font-family:ui-monospace,Menlo,monospace;font-size:11px}
  .stage{padding:20px 14px;display:flex;align-items:center;justify-content:center;gap:22px}
  .btn{padding:9px 20px;border-radius:10px;font-size:13.5px;font-weight:600;
       display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent}
  .panel{width:76px;height:40px;border-radius:9px;border:1px solid transparent}
  .legend{display:flex;gap:22px;font-size:10.5px;color:rgba(255,255,255,.4);padding:0 14px 4px}
  .foot{display:flex;justify-content:space-between;align-items:baseline;
        padding:8px 14px 11px;font-size:11px;color:rgba(255,255,255,.45);
        font-family:ui-monospace,Menlo,monospace;border-top:1px solid var(--liminal-role-panel-border)}
  .foot .d{color:#7fd0a0}
  .note{max-width:640px;margin-top:22px;color:rgba(255,255,255,.5);font-size:13px;line-height:2;text-align:center}
</style>
</head>
<body>
  <h1>مرز باتن، روی هر لایه</h1>
  <p class="sub">
    مرز باتن <b>یک پله بالای fill خودش</b> است — و در این با <b>مرز یک سطح</b> یکی است.
    کنار هم می‌بینی‌شان.
  </p>
  <div class="formula">مرز = سطح خودش + ۱.۱۴۱۶q</div>

  <div class="rows" id="rows"></div>

  <p class="note" id="note"></p>

<script>
  const css = getComputedStyle(document.documentElement);
  const num = (n) => parseFloat(css.getPropertyValue(n));
  const S = (n) => css.getPropertyValue(`--liminal-s${n}`).trim();
  const CANVAS_L = num('--liminal-canvas-l'), STEP = num('--liminal-step');
  const C = num('--liminal-chroma'), H = num('--liminal-hue'), Q = num('--liminal-q');
  const at = (level) => `oklch(${(CANVAS_L + level * STEP).toFixed(7)} ${C} ${H})`;
  const stepQ = (STEP / Q).toFixed(4);
  const MAX = 8;

  const ROLE = ['بوم', 'لایه ۱ · chrome', 'لایه ۲ · work', 'لایه ۳ · panel',
                'لایه ۴ · control', 'menu', 'popover', 'modal', 'toast'];

  const rows = document.getElementById('rows');
  for (let host = 0; host <= 7; host++) {
    const fill = Math.min(MAX, host + 1);
    // The border is one step above the fill, capped at half a step down at the ceiling.
    const raw = fill + 1;
    const border = raw > MAX ? MAX - 0.5 : raw;
    const capped = raw > MAX;
    const d = ((border - fill) * STEP / Q).toFixed(4);

    const el = document.createElement('div'); el.className = 'row';
    el.innerHTML = `
      <div class="head">
        <span class="name">${ROLE[host]}</span>
        <span class="lv">میزبان S${host} · fill S${fill} · مرز S${border}</span>
      </div>
      <div class="stage" style="background:${S(host)}">
        <span class="btn" style="background:${at(fill)};border-color:${at(border)};color:${at(Math.min(MAX, fill + 3))}">دکمه</span>
        <span class="panel" style="background:${at(3)};border-color:${at(4)}"></span>
      </div>
      <div class="legend"><span>باتن</span><span style="margin-inline-start:auto">یک سطح</span></div>
      <div class="foot">
        <span>مرز باتن S${border} · مرز سطح S4</span>
        <span class="d" style="${capped ? 'color:#e0b070' : ''}">${d}q</span>
      </div>`;
    rows.appendChild(el);
  }

  document.getElementById('note').innerHTML =
    `<b>و یک قاعده‌اند:</b> مرز باتن یک پله بالای fill خودش است، و مرز یک سطح یک پله بالای
     خودش — <b>هر دو <code>۱.۱۴۱۶q</code></b>. باتن چون یک <b>رابطه</b> است با میزبانش جابه‌جا
     می‌شود؛ سطح چون یک <b>پلهٔ مطلق</b> است ثابت می‌ماند.<br><br>
     <b>و یک استثنا:</b> روی <b>modal</b> (<code>S7</code>) سقف می‌گیرد — <code>S8 + 1 = S9</code>
     وجود ندارد، پس مرز به <b>نیم‌پله زیر fill</b> برمی‌گردد. همان تصمیم سقف سخت: تنزل، نه گسترش.`;
</script>
</body>
</html>
