<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>انتخاب چشمی q — بوم #060709</title>
<style>
  :root { --C: 0.0069; --H: 258.4; --L0: 0.128; --q: 0.0083; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #060709; color: #cfd6e4; font-family: system-ui, Vazirmatn, sans-serif; padding: 16px; }
  h1 { font-size: 18px; margin: 4px 0 6px; }
  .intro { font-size: 13px; opacity: .8; line-height: 1.7; margin-bottom: 14px; }
  .opt { border-radius: 14px; padding: 14px; margin-bottom: 14px; background: #060709; border: 1px solid #1a1f29; }
  .opt-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .opt-name { font-weight: 700; font-size: 15px; }
  .opt-val { font-family: ui-monospace, monospace; font-size: 13px; opacity: .85; direction: ltr; }
  .stage { border-radius: 12px; padding: 14px; background: #060709; display: grid; gap: 12px; }
  .surface { border-radius: 10px; padding: 12px; color: #e6ebf5; font-size: 13px; }
  .btn { display: inline-block; border: 0; border-radius: 8px; padding: 8px 14px; font-size: 13px; color: #e6ebf5; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .tag { font-size: 11px; opacity: .65; direction: ltr; font-family: ui-monospace, monospace; }
  .note { font-size: 12px; opacity: .75; margin-top: 8px; line-height: 1.6; }
</style>
</head>
<body>
<h1>کدام گام q را می‌بینی؟</h1>
<div class="intro">
  هر کارت یک گزینهٔ q است. در هر کارت، سطح بالایی (روشن‌تر) یک پله از سطح پایینی بالاتر است. بدون اندازه‌گیری، فقط نگاه کن: کدام کارت را ترجیح می‌دهی که «پله» را واضح ببینی، بدون اینکه خیلی پررنگ شود؟ شماره‌ای را که انتخاب کردی بگو.
</div>
<div id="opts"></div>
<script>
  const L0 = 0.128, Q = 0.0083; // colours below are exact sRGB hex (OKLCH L 0.128 / C 0.0069 / H 258.4)
  const options = [
  {
    "id": "A",
    "m": 0.75,
    "lo": "#060709",
    "hi": "#07080b",
    "L1": "0.1342"
  },
  {
    "id": "B",
    "m": 1,
    "lo": "#060709",
    "hi": "#07080b",
    "L1": "0.1363"
  },
  {
    "id": "C",
    "m": 1.25,
    "lo": "#060709",
    "hi": "#07090c",
    "L1": "0.1384"
  },
  {
    "id": "D",
    "m": 1.5,
    "lo": "#060709",
    "hi": "#08090c",
    "L1": "0.1404"
  }
];
  const root = document.getElementById('opts');
  for (const o of options) {
    const L1 = o.L1; const lo = o.lo; const hi = o.hi;
    root.insertAdjacentHTML('beforeend', `
      <section class="opt">
        <div class="opt-head">
          <div class="opt-name">گزینهٔ ${o.id}</div>
          <div class="opt-val">${val}</div>
        </div>
        <div class="stage">
          <div class="surface" style="background:${lo};border-color:${hi}">
            سطح پایین <span class="tag">L ${L0}</span>
          </div>
          <div class="surface" style="background:${hi};border:1px solid ${lo}">
            سطح بالا <span class="tag">L ${L1.toFixed(4)}</span>
            <div class="row" style="margin-top:10px">
              <span class="btn" style="background:${hi}">دکمه</span>
              <span class="btn" style="background:${lo};border:1px solid ${hi}">دکمهٔ دوم</span>
            </div>
          </div>
        </div>
        <div class="note">ببین: پلهٔ بین دو سطح چقدر واضح است؟ آیا دکمه‌ها از سطح جدا به نظر می‌رسند؟</div>
      </section>`);
  }
</script>
</body>
</html>
