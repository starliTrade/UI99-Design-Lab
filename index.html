<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI99 Design Lab</title>
    <meta name="description" content="Research environment for measuring dark-surface hierarchy, mathematical contrast, border necessity, and nested geometry for the UI99 token engine." />
    <meta property="og:title" content="UI99 Design Lab" />
    <meta property="og:description" content="Research environment for measuring dark-surface hierarchy, mathematical contrast, border necessity, and nested geometry for the UI99 token engine." />
    <!--
      NO FONT CDN, AND NO TAILWIND COLOUR CLASSES ON <body>.

      The page asked Google for Inter and JetBrains Mono while `liminal-fonts-latin.css`
      already self-hosts Inter — so the face was fetched twice, from a network that may
      not answer, and the self-hosted file was never the one that loaded. The body also
      carried `bg-[#030406] text-[#eef0f3]`: two raw colours on the outermost element of
      a system whose first rule is that raw values are forbidden. Both live in
      `src/index.css` now, as `var(--liminal-…)`.
    -->
    <script>
      /* GITHUB PAGES REDIRECT — AND NOTHING ELSE.

         This file is Vite's dev shell: its module is raw TSX, which a browser on
         Pages cannot run, so the site renders blank white at the root. When served
         from *.github.io, go straight to the audit snapshot — static,
         self-contained HTML that needs no build. On localhost (dev) this is a
         no-op; Vite keeps owning this file. */
      if (location.hostname.endsWith('.github.io')) {
        location.replace('/UI99-Design-Lab/.lab/audit-lab-snapshot.html');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
