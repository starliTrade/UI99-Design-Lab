      NO FONT CDN, AND NO TAILWIND COLOUR CLASSES ON <body>.

      The page asked Google for Inter and JetBrains Mono while `liminal-fonts-latin.css`

      not answer, and the self-hosted file was never the one that loaded. The body also
      carried `bg-[#030406] text-[#eef0f3]`: two raw colours on the outermost element of
      a system whose first rule is that raw values are forbidden. Both live in
      `src/index.css` now, as `var(--liminal-…)`.
