name: Feature request
description: Propose a component, token or capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the need, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you use today instead?
      description: Helps us judge whether this belongs in the core or in userland.
  - type: checkboxes
    id: contract
    attributes:
      label: Contract fit
      options:
        - label: This can be expressed with existing tokens (no new token needed).
        - label: This needs a new token or rule, and I am willing to write the experiment.
